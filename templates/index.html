<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXURY WATER — PREMIUM SELECTION</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="classic-page">

<!-- ===== ЖЕМЧУЖНАЯ ПЛАВАЮЩАЯ КОРЗИНА ===== -->
<div class="cart-widget" id="cartWidget">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <path d="M16 10a4 4 0 0 1-8 0"></path>
    </svg>
    <span class="cart-count" id="cartCount">0</span>
</div>

<!-- ============================================================ -->
<!-- ТЕРМИНАЛ КОРЗИНЫ С ДВУМЯ ЭКРАНАМИ -->
<!-- ============================================================ -->
<div class="cart-modal" id="cartModal">
    <div class="cart-modal-content">

        <div class="cart-modal-header">
            <h2>ТЕРМИНАЛ // КОРЗИНА</h2>
            <button class="btn-close-cart" id="closeCartBtn">&times;</button>
        </div>

        <!-- ===== ЭКРАН 1: СПИСОК ТОВАРОВ ===== -->
        <div id="cartMainView">
            <div class="cart-items-list" id="cartItemsList"></div>
            <div class="cart-modal-footer">
                <div class="cart-total-row">
                    <span>ИТОГО К ОПЛАТЕ:</span>
                    <span id="cartTotalSum">₽0</span>
                </div>
                <button class="btn-checkout" id="checkoutStartBtn">ОФОРМИТЬ ЗАКАЗ</button>
                <button class="btn-clear-cart" id="clearCartBtn">ОЧИСТИТЬ КОРЗИНУ</button>
                <button class="btn-feedback" id="feedbackOpenBtn">ОБРАТНАЯ СВЯЗЬ</button>
            </div>
        </div>

        <!-- ===== ЭКРАН 2: ФОРМА ЗАКАЗА ===== -->
        <div id="checkoutFormView" style="display:none; flex-grow:1; flex-direction:column; justify-content:center;">
            <div class="checkout-form-container">
                <h3 style="font-family:'Syncopate',sans-serif; font-size:0.9rem; letter-spacing:2px; color:#2c323e; margin-bottom:25px; text-align:center;">ДАННЫЕ ДЛЯ ДОСТАВКИ</h3>
                <form id="orderDataForm" style="display:flex; flex-direction:column; gap:14px;">
                    <input type="text" id="orderName" placeholder="Имя" required style="padding:16px 18px; border-radius:14px; border:1px solid rgba(44,50,62,0.08); font-size:0.95rem; background:#fbf9fa; outline:none; transition:border-color 0.3s;">
                    <input type="tel" id="orderPhone" placeholder="+7 999 999-99-99" required style="padding:16px 18px; border-radius:14px; border:1px solid rgba(44,50,62,0.08); font-size:0.95rem; background:#fbf9fa; outline:none; transition:border-color 0.3s;">
                    <input type="email" id="orderEmail" placeholder="E-mail" required style="padding:16px 18px; border-radius:14px; border:1px solid rgba(44,50,62,0.08); font-size:0.95rem; background:#fbf9fa; outline:none; transition:border-color 0.3s;">
                    <button type="submit" style="padding:18px; border-radius:14px; border:none; background:#2c323e; color:#ffffff; font-weight:700; font-size:0.9rem; letter-spacing:1px; cursor:pointer; transition:all 0.3s;">ПОДТВЕРДИТЬ ЗАКАЗ</button>
                    <button type="button" id="backToCartBtn" style="padding:14px; border-radius:14px; border:1px solid rgba(44,50,62,0.08); background:transparent; color:#8c93a1; font-weight:600; font-size:0.85rem; cursor:pointer; transition:all 0.3s;">← ВЕРНУТЬСЯ К КОРЗИНЕ</button>
                </form>
            </div>
        </div>

    </div>
</div>

<!-- ============================================================ -->
<!-- ОВЕРЛЕЙ УСПЕХА -->
<!-- ============================================================ -->
<div class="success-overlay" id="successModal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(44,50,62,0.35); backdrop-filter:blur(12px); z-index:9999999; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.4s;">
    <div class="success-box" style="background:#ffffff; border-radius:28px; padding:50px 40px; max-width:400px; width:92%; text-align:center; box-shadow:0 50px 100px rgba(44,50,62,0.15); transform:scale(0.92); transition:transform 0.4s;">
        <div style="font-size:4rem; color:#4caf50; display:inline-block; width:70px; height:70px; line-height:70px; border-radius:50%; background:rgba(76,175,80,0.1); margin-bottom:20px;">✓</div>
        <h2 style="font-family:'Syncopate',sans-serif; font-size:1.1rem; letter-spacing:2px; color:#2c323e; margin-bottom:10px;">ЗАКАЗ УСПЕШНО ВЫПОЛНЕН</h2>
        <p style="color:#8c93a1; font-size:0.9rem; margin-bottom:25px;">Наш консьерж свяжется с вами в ближайшее время.</p>
        <button id="successCloseBtn" style="padding:14px 45px; border-radius:14px; border:none; background:#2c323e; color:#ffffff; font-weight:700; font-size:0.85rem; letter-spacing:1px; cursor:pointer; transition:all 0.3s;">ОТЛИЧНО</button>
    </div>
</div>

<!-- ============================================================ -->
<!-- МОДАЛКА ОБРАТНОЙ СВЯЗИ -->
<!-- ============================================================ -->
<div class="feedback-overlay" id="feedbackModal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(44,50,62,0.35); backdrop-filter:blur(10px); z-index:9999998; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.4s;">
    <div class="feedback-box" style="background:#ffffff; border-radius:28px; padding:40px 35px; max-width:400px; width:92%; box-shadow:0 50px 100px rgba(44,50,62,0.15); transform:scale(0.92); transition:transform 0.4s;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; border-bottom:1px solid rgba(44,50,62,0.05); padding-bottom:12px;">
            <h2 style="font-family:'Syncopate',sans-serif; font-size:0.9rem; letter-spacing:2px; color:#2c323e;">СООБЩЕНИЕ КОНСЬЕРЖУ</h2>
            <button id="feedbackCloseBtn" style="background:transparent; border:none; color:#b5bbc6; font-size:1.8rem; cursor:pointer;">&times;</button>
        </div>
        <form id="feedbackDataForm" style="display:flex; flex-direction:column; gap:14px;">
            <input type="text" id="feedbackName" placeholder="Ваше имя" required style="padding:14px 16px; border-radius:14px; border:1px solid rgba(44,50,62,0.08); font-size:0.9rem; background:#fbf9fa; outline:none; transition:border-color 0.3s;">
            <input type="tel" id="feedbackPhone" placeholder="+7 999 999-99-99" required style="padding:14px 16px; border-radius:14px; border:1px solid rgba(44,50,62,0.08); font-size:0.9rem; background:#fbf9fa; outline:none; transition:border-color 0.3s;">
            <input type="email" id="feedbackEmail" placeholder="E-mail" required style="padding:14px 16px; border-radius:14px; border:1px solid rgba(44,50,62,0.08); font-size:0.9rem; background:#fbf9fa; outline:none; transition:border-color 0.3s;">
            <textarea id="feedbackMessage" placeholder="Ваше сообщение..." rows="3" required style="padding:14px 16px; border-radius:14px; border:1px solid rgba(44,50,62,0.08); font-size:0.9rem; background:#fbf9fa; outline:none; resize:vertical; min-height:80px; font-family:'Montserrat',sans-serif; transition:border-color 0.3s;"></textarea>
            <button type="submit" style="padding:16px; border-radius:14px; border:none; background:#2c323e; color:#ffffff; font-weight:700; font-size:0.85rem; letter-spacing:1px; cursor:pointer; transition:all 0.3s;">ОТПРАВИТЬ</button>
        </form>
        <p style="text-align:center; color:#b5bbc6; font-size:0.75rem; margin-top:14px;">📞 Или позвоните: <strong style="color:#2c323e;">+7 999 999-99-99</strong></p>
    </div>
</div>

<!-- ============================================================ -->
<!-- ВИТРИНА (КАТАЛОГ) -->
<!-- ============================================================ -->
<div class="catalog-wrapper">
    <header class="store-header">
        <h1 class="main-logo">
            <span class="dark-premium">PREMIUM</span> 
            <span class="neon-blue-water">WATER</span>
        </h1>
    </header>
    
    <div class="classic-grid">
        {% for p in products %}
        <div class="grid-card">
            <a href="/product/{{ p.id }}" class="grid-card-link">
                <div class="grid-img-frame">
                    <img src="/static/images/{{ p.image }}" alt="{{ p.name }}">
                </div>
                <div class="grid-meta">
                    <h2>{{ p.name }}</h2>
                    <span class="classic-price">₽{{ p.price_rub }}</span>
                </div>
            </a>
            <!-- 🔥 КНОПКА ДОБАВЛЕНИЯ ПРЯМО В КАРТОЧКЕ -->
            <button class="btn-add-from-catalog" data-id="{{ p.id }}" data-name="{{ p.name }}" data-price="{{ p.price_rub }}">ДОБАВИТЬ В КОРЗИНУ</button>
        </div>
        {% endfor %}
    </div>
</div>

<!-- ============================================================ -->
<!-- СКРИПТЫ -->
<!-- ============================================================ -->
<script>
    // ============================================================
    // ОСНОВНАЯ ЛОГИКА КОРЗИНЫ
    // ============================================================
    const cartWidget = document.getElementById('cartWidget');
    const cartModal = document.getElementById('cartModal');
    const closeCartBtn = document.getElementById('closeCartBtn');
    const cartCount = document.getElementById('cartCount');
    const cartItemsList = document.getElementById('cartItemsList');
    const cartTotalSum = document.getElementById('cartTotalSum');
    const clearCartBtn = document.getElementById('clearCartBtn');

    const checkoutStartBtn = document.getElementById('checkoutStartBtn');
    const cartMainView = document.getElementById('cartMainView');
    const checkoutFormView = document.getElementById('checkoutFormView');
    const backToCartBtn = document.getElementById('backToCartBtn');
    const orderDataForm = document.getElementById('orderDataForm');

    const successModal = document.getElementById('successModal');
    const successCloseBtn = document.getElementById('successCloseBtn');

    const feedbackOpenBtn = document.getElementById('feedbackOpenBtn');
    const feedbackModal = document.getElementById('feedbackModal');
    const feedbackCloseBtn = document.getElementById('feedbackCloseBtn');
    const feedbackDataForm = document.getElementById('feedbackDataForm');

    // ============================================================
    // КОРЗИНА В localStorage
    // ============================================================
    let cart = JSON.parse(localStorage.getItem('water_cart')) || [];

    function updateCartUI() {
        localStorage.setItem('water_cart', JSON.stringify(cart));
        let totalCount = 0;
        let totalSum = 0;
        for (let i = 0; i < cart.length; i++) {
            totalCount += cart[i].qty;
            totalSum += (cart[i].price * cart[i].qty);
        }
        cartCount.innerText = totalCount;
        cartTotalSum.innerText = '₽' + totalSum;

        if (cart.length === 0) {
            cartItemsList.innerHTML = '<p class="empty-cart-text">КОРЗИНА ПУСТА</p>';
            if (checkoutStartBtn) {
                checkoutStartBtn.style.opacity = '0.4';
                checkoutStartBtn.style.pointerEvents = 'none';
            }
        } else {
            if (checkoutStartBtn) {
                checkoutStartBtn.style.opacity = '1';
                checkoutStartBtn.style.pointerEvents = 'auto';
            }
            cartItemsList.innerHTML = cart.map(function(item) {
                return `
                    <div class="cart-item">
                        <div class="cart-item-details">
                            <h4>${item.name}</h4>
                            <p>₽${item.price} x ${item.qty}</p>
                        </div>
                        <button class="btn-delete-item" onclick="removeProduct(${item.id})">&times;</button>
                    </div>
                `;
            }).join('');
        }
    }

    window.removeProduct = function(id) {
        cart = cart.filter(function(item) { return item.id !== id; });
        updateCartUI();
    };

    // ============================================================
    // ФУНКЦИЯ ДОБАВЛЕНИЯ ТОВАРА
    // ============================================================
    function addToCart(productId, productName, productPrice) {
        const exist = cart.find(function(item) { return item.id === productId; });
        if (exist) {
            exist.qty = exist.qty + 1;
        } else {
            cart.push({
                id: productId,
                name: productName,
                price: productPrice,
                qty: 1
            });
        }
        updateCartUI();
    }

    // ============================================================
    // КНОПКИ ДОБАВЛЕНИЯ В КАРТОЧКАХ (НА ГЛАВНОЙ)
    // ============================================================
    document.querySelectorAll('.btn-add-from-catalog').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation(); // чтобы не переходило на страницу товара
            
            const id = parseInt(this.getAttribute('data-id'));
            const name = this.getAttribute('data-name');
            const price = parseInt(this.getAttribute('data-price'));
            
            addToCart(id, name, price);
            
            // Визуальный фидбэк
            this.style.background = '#00ff66';
            this.style.color = '#000000';
            this.innerText = '✅ ДОБАВЛЕНО!';
            setTimeout(function() {
                btn.style.background = '';
                btn.style.color = '';
                btn.innerText = 'ДОБАВИТЬ В КОРЗИНУ';
            }, 1000);
        });
    });

    // ============================================================
    // ОСТАЛЬНАЯ ЛОГИКА
    // ============================================================
    if (cartWidget) {
        cartWidget.addEventListener('click', function() {
            if (cartMainView) cartMainView.style.display = 'block';
            if (checkoutFormView) checkoutFormView.style.display = 'none';
            cartModal.classList.add('open');
        });
    }

    if (closeCartBtn) {
        closeCartBtn.addEventListener('click', function() {
            cartModal.classList.remove('open');
        });
    }

    if (clearCartBtn) {
        clearCartBtn.addEventListener('click', function() {
            cart = [];
            updateCartUI();
        });
    }

    if (checkoutStartBtn) {
        checkoutStartBtn.addEventListener('click', function() {
            if (cart.length === 0) return;
            if (cartMainView) cartMainView.style.display = 'none';
            if (checkoutFormView) checkoutFormView.style.display = 'flex';
        });
    }

    if (backToCartBtn) {
        backToCartBtn.addEventListener('click', function() {
            if (checkoutFormView) checkoutFormView.style.display = 'none';
            if (cartMainView) cartMainView.style.display = 'block';
        });
    }

    if (orderDataForm) {
        orderDataForm.addEventListener('submit', function(e) {
            e.preventDefault();
            cart = [];
            updateCartUI();
            if (cartModal) cartModal.classList.remove('open');
            if (successModal) successModal.classList.add('visible');
            orderDataForm.reset();
            if (checkoutFormView) checkoutFormView.style.display = 'none';
            if (cartMainView) cartMainView.style.display = 'block';
        });
    }

    if (successCloseBtn) {
        successCloseBtn.addEventListener('click', function() {
            successModal.classList.remove('visible');
        });
    }

    if (feedbackOpenBtn) {
        feedbackOpenBtn.addEventListener('click', function() {
            if (feedbackModal) feedbackModal.classList.add('visible');
        });
    }

    if (feedbackCloseBtn) {
        feedbackCloseBtn.addEventListener('click', function() {
            if (feedbackModal) feedbackModal.classList.remove('visible');
        });
    }

    if (feedbackDataForm) {
        feedbackDataForm.addEventListener('submit', function(e) {
            e.preventDefault();
            if (feedbackModal) feedbackModal.classList.remove('visible');
            feedbackDataForm.reset();
            alert('✅ Сообщение консьержу успешно отправлено!');
        });
    }

    // ============================================================
    // ПЕРВИЧНЫЙ ЗАПУСК
    // ============================================================
    updateCartUI();

    // ============================================================
    // 3D-САКУРА
    // ============================================================
    function createSakuraPetal() {
        const petal = document.createElement('div');
        petal.classList.add('sakura-petal');
        const size = Math.random() * 8 + 8;
        petal.style.width = size + 'px';
        petal.style.height = (size * 1.2) + 'px';
        petal.style.left = Math.random() * window.innerWidth + 'px';

        let top = -20;
        let left = parseFloat(petal.style.left);
        const speed = Math.random() * 1.5 + 1;
        const wind = Math.random() * 0.5 - 0.2;

        let rotX = Math.random() * 360;
        let rotY = Math.random() * 360;
        let rotZ = Math.random() * 360;
        const rotSpeedX = Math.random() * 2 - 1;
        const rotSpeedY = Math.random() * 2 - 1;
        const rotSpeedZ = Math.random() * 1;

        document.body.appendChild(petal);

        function step() {
            top += speed;
            left += wind + Math.sin(top / 30) * 0.5;
            rotX += rotSpeedX;
            rotY += rotSpeedY;
            rotZ += rotSpeedZ;

            petal.style.top = top + 'px';
            petal.style.left = left + 'px';
            petal.style.transform = 'rotateX(' + rotX + 'deg) rotateY(' + rotY + 'deg) rotateZ(' + rotZ + 'deg)';

            if (top < window.innerHeight) {
                requestAnimationFrame(step);
            } else {
                petal.remove();
            }
        }
        requestAnimationFrame(step);
    }

    setInterval(createSakuraPetal, 400);

    // ============================================================
    // МАСКА ТЕЛЕФОНА
    // ============================================================
    function maskPhone(input) {
        input.value = input.value.replace(/[^0-9+\s\-()]/g, '');
        if (input.value.length > 0 && !input.value.startsWith('+')) {
            let digits = input.value.replace(/\D/g, '');
            if (digits.length > 0) {
                if (digits[0] === '8') {
                    input.value = '+7' + digits.substring(1);
                } else if (digits[0] === '7') {
                    input.value = '+' + digits;
                } else if (digits.length >= 1) {
                    input.value = '+7' + digits;
                }
            }
        }
        if (input.value === '+') return;
        let cleaned = input.value.replace(/\D/g, '');
        let formatted = '';
        if (cleaned.length > 0) {
            if (cleaned[0] === '8' || cleaned[0] === '7') {
                formatted = '+7';
                let rest = cleaned.substring(1);
                if (rest.length > 0) formatted += ' ' + rest.substring(0, 3);
                if (rest.length > 3) formatted += ' ' + rest.substring(3, 6);
                if (rest.length > 6) formatted += '-' + rest.substring(6, 8);
                if (rest.length > 8) formatted += '-' + rest.substring(8, 10);
            } else {
                formatted = '+' + cleaned;
            }
        }
        if (input.value !== formatted) {
            input.value = formatted;
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('input[type="tel"]').forEach(function(input) {
            input.addEventListener('input', function() { maskPhone(this); });
            input.addEventListener('blur', function() { maskPhone(this); });
        });
    });
</script>

</body>
</html>
